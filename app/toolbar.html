<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MiniMeet Kontroller</title>
  <link rel="stylesheet" href="toolbar.css" />
</head>
<body>
  <div class="bar">
    <div id="toolbarTimer" class="toolbar-timer hidden"><span>Kalan</span><strong id="toolbarTimerText">05:00</strong></div>
    <button id="micBtn"><span>🎤</span><small>Mikrofon</small></button>
    <button id="camBtn"><span>🎥</span><small>Kamera</small></button>
    <button id="devicesBtn"><span>⚙️</span><small>Ayarlar</small></button>
    <button id="shareBtn" class="share"><span>🖥️</span><small>Ekranı Paylaş</small></button>
    <button id="drawBtn"><span>✏️</span><small>Çizim</small></button>
    <button id="linkBtn"><span>🔗</span><small>Link</small></button>
    <button id="endBtn" class="end"><span>⏹</span><small>Toplantıyı Bitir</small></button>
  </div>
  <script src="toolbar.js"></script>
</body>
</html>
